<!DOCTYPE html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Firma de préstamo · NEXUS PRO Financiamiento</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
:root{--c:#4f46e5;--c2:#6d28d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f3fb;color:#0f172a;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:36px}
.topaccent{height:6px;background:linear-gradient(90deg,var(--c),var(--c2))}
.nav{display:flex;align-items:center;gap:11px;padding:14px}
.nav .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--c),var(--c2));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex:0 0 auto}
.nav .ttl b{display:block;font-size:15px;font-weight:800}
.nav .ttl span{display:block;font-size:11px;color:#64748b;font-weight:600}
.body{padding:0 14px 14px}
.msg{text-align:center;padding:60px 20px;color:#64748b;font-size:14px}
.msg i{font-size:34px;display:block;margin-bottom:10px;color:var(--c)}
.spin{width:26px;height:26px;border:3px solid #e2e8f0;border-top-color:var(--c);border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:#fff;border:1px solid #e8e6f7;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(76,29,149,.05)}
.sec{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.sec .nb{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sec h3{margin:0;font-size:14px;font-weight:800}
.termrow{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid #f1f0fa}
.termrow:last-child{border-bottom:0}
.termrow span:first-child{color:#64748b}
.termrow b{color:#1e1b4b}
.declar{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:12px;font-size:12.5px;color:#4c1d95;line-height:1.55;margin-top:10px}
label.fl{display:block;font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.3px;margin:12px 0 6px}
label.fl:first-child{margin-top:0}
.in{width:100%;height:46px;padding:0 13px;border:1.5px solid #e2e8f0;border-radius:11px;font-size:15px;outline:none;font-family:inherit;background:#fff}
.in:focus{border-color:var(--c)}
.docbtn{display:flex;align-items:center;gap:10px;border:1.5px dashed #c7b8f5;border-radius:12px;padding:12px;cursor:pointer;background:#faf9ff}
.docbtn i{font-size:22px;color:var(--c)}
.docbtn b{font-size:12.5px;display:block}
.docbtn span{font-size:10.5px;color:#7c748f}
.docbtn.ok{border-style:solid;border-color:#86efac;background:#f0fdf4}
.docbtn.ok i{color:#16a34a}
.docprev{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.docprev img{width:100%;display:block;max-height:160px;object-fit:cover}
.sigwrap{border:1.5px solid #e2e8f0;border-radius:12px;overflow:hidden;background:#fff;touch-action:none}
.sigwrap canvas{width:100%;height:160px;display:block}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.sigbar span{font-size:10.5px;color:#94a3b8}
.sigbar button{background:none;border:0;color:var(--c);font-weight:800;font-size:11.5px;cursor:pointer;padding:6px 8px}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:#334155;line-height:1.5;margin-top:4px}
.chk input{margin-top:2px;width:18px;height:18px;flex:0 0 auto}
.pubbtn{width:100%;border:0;border-radius:14px;padding:16px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--c),var(--c2));cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,opacity .15s ease}
.pubbtn:active{transform:scale(.97)}
.pubbtn:disabled{opacity:.4;cursor:not-allowed}
.okwrap{text-align:center;padding:50px 20px}
.okwrap .ic{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:#16a34a;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.okwrap h2{font-size:17px;margin:0 0 8px}
.okwrap p{font-size:13px;color:#64748b;line-height:1.6}
.guion{background:#0f172a;color:#f8fafc;border-radius:12px;padding:14px;font-size:14.5px;line-height:1.65;margin:10px 0}
.guion .gl{display:block;font-size:10px;font-weight:800;color:#a5b4fc;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
.guion b{color:#fff}
.vidprev{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;background:#000}
.vidprev video{width:100%;display:block;max-height:220px}
.subiendo{display:flex;align-items:center;gap:8px;font-size:12px;color:#4c1d95;background:#f5f3ff;border-radius:10px;padding:10px;margin-top:8px}
.subiendo .spin{width:16px;height:16px;border-width:2px;margin:0}
</style>
</head>
<body>
<div class="topaccent"></div>
<div class="wrap" id="app"><div class="msg"><div class="spin"></div>Cargando…</div></div>
<script>
(function(){
  var FUNC="https://tnwsgcxurfyuszxsewsn.supabase.co/functions/v1/prestamo-solicitud";
  var app=document.getElementById("app");
  var id=new URLSearchParams(location.search).get("id")||"";
  var S=null;
  var doc={frente:"",dorso:"",selfie:""};
  var sigCanvas=null, sigCtx=null, sigDrawing=false, sigTiene=false, sigLastXY=null;
  var enviando=false;
  var vid={path:"",subiendo:false,nombre:""};

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c];});}
  function fmt(n){return "RD$ "+Math.round(Number(n||0)).toLocaleString("en-US");}
  function primerNombre(n){return String(n||"").trim().split(/\s+/)[0]||"";}

  if(!id){ mostrarMsg("ti-link-off","Enlace inválido","Este link de firma no es válido. Pide al negocio que te envíe uno nuevo."); return; }
  cargar();

  function cargar(){
    fetch(FUNC+"?id="+encodeURIComponent(id)).then(function(r){return r.ok?r.json():Promise.reject();}).then(function(d){
      if(d.error){ mostrarMsg("ti-alert-triangle","No se pudo cargar","Este link no existe o ya no está disponible."); return; }
      S=d;
      if(S.estado==="enviada"){ mostrarMsg("ti-hourglass-high","Ya enviaste tus datos","Estamos revisando tu información. El negocio te avisará cuando esté listo."); return; }
      if(S.estado==="aprobada"){ mostrarMsg("ti-circle-check","Préstamo ya aprobado","Este trámite ya fue completado y aprobado. Gracias."); return; }
      if(S.estado==="rechazada"){ mostrarMsg("ti-x","Solicitud no aprobada","Esta solicitud no fue aprobada. Comunícate con el negocio para más información."); return; }
      render();
    }).catch(function(){ mostrarMsg("ti-wifi-off","No se pudo cargar","Verifica tu conexión e intenta de nuevo."); });
  }

  function mostrarMsg(ico,tit,sub){
    app.innerHTML='<div class="nav"><div class="lg"><i class="ti ti-signature"></i></div><div class="ttl"><b>Firma de préstamo</b><span>NEXUS PRO Financiamiento</span></div></div>'
      +'<div class="body"><div class="msg"><i class="ti '+ico+'"></i><b style="display:block;color:#1e293b;font-size:15px;margin-bottom:6px">'+esc(tit)+'</b>'+esc(sub)+'</div></div>';
  }

  function terminosTexto(){
    if(S.modo==="credito"){
      return "Línea de crédito de "+fmt(S.capital)+" con "+ (S.tasa_interes||0) +"% de interés mensual"+(S.plazo_meses?", a devolver el capital en un plazo de "+S.plazo_meses+" meses":"")+".";
    }
    var frecTxt={semanal:"semanal",quincenal:"quincenal",mensual:"mensual"}[S.frecuencia]||S.frecuencia||"";
    return (S.num_cuotas||"—")+" cuotas "+frecTxt+" de "+fmt(S.cuota_calculada)+" cada una, para un total a devolver de "+fmt(S.total_devolver)+" sobre un capital de "+fmt(S.capital)+".";
  }

  // El guion NO es texto libre: se arma con los términos REALES de este préstamo, para que
  // lo que el cliente dice en el video coincida exactamente con lo que va a firmar.
  function guionTexto(){
    var nom=String(S.nombre||"").trim();
    if(S.modo==="credito"){
      return "Yo, "+nom+", declaro que recibí una línea de crédito de "+fmt(S.capital)
        +" con "+(S.tasa_interes||0)+" por ciento de interés mensual"
        +(S.plazo_meses?", y me comprometo a devolver el capital en un plazo de "+S.plazo_meses+" meses":"")
        +", y a pagar los intereses cada mes.";
    }
    var frecTxt={semanal:"semanales",quincenal:"quincenales",mensual:"mensuales"}[S.frecuencia]||"";
    return "Yo, "+nom+", declaro que recibí un préstamo de "+fmt(S.capital)
      +", y me comprometo a pagarlo en "+(S.num_cuotas||"—")+" cuotas "+frecTxt
      +" de "+fmt(S.cuota_calculada)+" cada una, para un total de "+fmt(S.total_devolver)+".";
  }

  function render(){
    var nom=esc(S.nombre||"");
    app.innerHTML =
      '<div class="nav"><div class="lg"><i class="ti ti-signature"></i></div><div class="ttl"><b>Firma de préstamo</b><span>NEXUS PRO Financiamiento</span></div></div>'
      +'<div class="body">'
      +'<div class="card"><div class="sec"><div class="nb">1</div><h3>Tu préstamo</h3></div>'
      +'<div class="termrow"><span>Cliente</span><b>'+nom+'</b></div>'
      +'<div class="termrow"><span>Monto prestado</span><b>'+fmt(S.capital)+'</b></div>'
      +(S.modo==="credito"?('<div class="termrow"><span>Tasa mensual</span><b>'+(S.tasa_interes||0)+'%</b></div>'):(
        '<div class="termrow"><span>Cuotas</span><b>'+(S.num_cuotas||"—")+' '+esc(S.frecuencia||"")+'</b></div>'
        +'<div class="termrow"><span>Cuota</span><b>'+fmt(S.cuota_calculada)+'</b></div>'
        +'<div class="termrow"><span>Total a devolver</span><b>'+fmt(S.total_devolver)+'</b></div>'
      ))
      +'<div class="declar">Yo, <b>'+nom+'</b>, declaro que acordé este préstamo con el negocio y me comprometo a pagarlo según lo descrito arriba: '+esc(terminosTexto())+'</div>'
      +'</div>'

      +'<div class="card"><div class="sec"><div class="nb">2</div><h3>Tu cédula</h3></div>'
      +'<label class="fl">Frente</label>'
      +'<input type="file" id="fFrente" accept="image/*" capture="environment" style="display:none" onchange="window.__docFile(this,\'frente\')">'
      +'<div class="docbtn" id="bFrente" onclick="document.getElementById(\'fFrente\').click()"><i class="ti ti-camera"></i><div><b>Tomar o subir foto</b><span>Parte de adelante, con letra clara</span></div></div>'
      +'<div id="pFrente"></div>'
      +'<label class="fl">Dorso</label>'
      +'<input type="file" id="fDorso" accept="image/*" capture="environment" style="display:none" onchange="window.__docFile(this,\'dorso\')">'
      +'<div class="docbtn" id="bDorso" onclick="document.getElementById(\'fDorso\').click()"><i class="ti ti-camera"></i><div><b>Tomar o subir foto</b><span>Parte de atrás</span></div></div>'
      +'<div id="pDorso"></div>'
      +'</div>'

      +'<div class="card"><div class="sec"><div class="nb">3</div><h3>Foto tuya con la cédula</h3></div>'
      +'<div style="font-size:12.5px;color:#64748b;line-height:1.5;margin-bottom:10px">Tómate una foto sosteniendo tu cédula al lado de tu cara. Que se vea tu rostro y la cédula con claridad.</div>'
      +'<input type="file" id="fSelfie" accept="image/*" capture="user" style="display:none" onchange="window.__docFile(this,\'selfie\')">'
      +'<div class="docbtn" id="bSelfie" onclick="document.getElementById(\'fSelfie\').click()"><i class="ti ti-user-scan"></i><div><b>Tomar la foto</b><span>Tu cara junto a la cédula</span></div></div>'
      +'<div id="pSelfie"></div>'
      +'</div>'

      +'<div class="card"><div class="sec"><div class="nb">4</div><h3>Video de compromiso</h3></div>'
      +'<div style="font-size:12.5px;color:#64748b;line-height:1.5">Graba un video corto leyendo en voz alta lo siguiente:</div>'
      +'<div class="guion"><span class="gl">Lee esto en el video</span>'+esc(guionTexto())+'</div>'
      +'<input type="file" id="fVideo" accept="video/*" capture="user" style="display:none" onchange="window.__videoFile(this)">'
      +'<div class="docbtn" id="bVideo" onclick="document.getElementById(\'fVideo\').click()"><i class="ti ti-video"></i><div><b>Grabar el video</b><span>Se abre la cámara de tu teléfono</span></div></div>'
      +'<div id="pVideo"></div>'
      +'</div>'

      +'<div class="card"><div class="sec"><div class="nb">5</div><h3>Tu firma</h3></div>'
      +'<div class="sigwrap"><canvas id="sigCv"></canvas></div>'
      +'<div class="sigbar"><span>Firma con el dedo dentro del recuadro</span><button type="button" onclick="window.__sigLimpiar()">Borrar</button></div>'
      +'</div>'

      +'<div class="card">'
      +'<label class="chk"><input type="checkbox" id="chkAcepto" onchange="window.__revisar()"> Acepto los términos de este préstamo tal como se describen arriba y confirmo que la cédula, la foto, el video y la firma son míos.</label>'
      +'<button type="button" class="pubbtn" id="btnPublicar" disabled onclick="window.__publicar()"><i class="ti ti-send"></i> Publicar</button>'
      +'</div>'
      +'</div>';
    setTimeout(initSig,0);
  }

  function initSig(){
    sigCanvas=document.getElementById("sigCv"); if(!sigCanvas)return;
    var rect=sigCanvas.getBoundingClientRect();
    var ratio=window.devicePixelRatio||1;
    sigCanvas.width=rect.width*ratio; sigCanvas.height=160*ratio;
    sigCtx=sigCanvas.getContext("2d"); sigCtx.scale(ratio,ratio);
    sigCtx.lineWidth=2.4; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#1e1b4b";
    function pos(ev){
      var r=sigCanvas.getBoundingClientRect();
      var t=ev.touches&&ev.touches[0];
      var x=(t?t.clientX:ev.clientX)-r.left, y=(t?t.clientY:ev.clientY)-r.top;
      return {x:x,y:y};
    }
    function start(ev){ ev.preventDefault(); sigDrawing=true; sigLastXY=pos(ev); }
    function move(ev){
      if(!sigDrawing)return; ev.preventDefault();
      var p=pos(ev);
      sigCtx.beginPath(); sigCtx.moveTo(sigLastXY.x,sigLastXY.y); sigCtx.lineTo(p.x,p.y); sigCtx.stroke();
      sigLastXY=p; sigTiene=true; window.__revisar();
    }
    function end(){ sigDrawing=false; }
    sigCanvas.addEventListener("mousedown",start); sigCanvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
    sigCanvas.addEventListener("touchstart",start,{passive:false}); sigCanvas.addEventListener("touchmove",move,{passive:false}); sigCanvas.addEventListener("touchend",end);
  }
  window.__sigLimpiar=function(){ if(!sigCtx)return; sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height); sigTiene=false; window.__revisar(); };

  // Mismo patrón de compresión ya usado en el sistema (canvas, máx 900px, JPEG 0.72) —
  // ver nxRifaImgFile en parches.js. Aquí es standalone (página pública aparte).
  window.__docFile=function(input,cual){
    var f=input.files&&input.files[0]; if(!f)return;
    if(f.size>12*1024*1024){ alert("La imagen es muy grande (máximo 12 MB)."); return; }
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var dataUrl;
        try{
          var max=1000, w=img.width, h=img.height;
          if(w>max){ h=Math.round(h*max/w); w=max; }
          var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          dataUrl=cv.toDataURL("image/jpeg",0.75);
        }catch(er){ dataUrl=ev.target.result; }
        doc[cual]=dataUrl;
        // Convención de ids: frente→bFrente/pFrente/fFrente, dorso→b/p/fDorso, selfie→b/p/fSelfie
        var cap=cual.charAt(0).toUpperCase()+cual.slice(1);
        var btn=document.getElementById("b"+cap);
        if(btn){ btn.classList.add("ok"); btn.innerHTML='<i class="ti ti-circle-check"></i><div><b>Foto lista</b><span>Toca para cambiarla</span></div>'; btn.onclick=function(){document.getElementById("f"+cap).click();}; }
        var prev=document.getElementById("p"+cap);
        if(prev) prev.innerHTML='<div class="docprev"><img src="'+dataUrl+'"></div>';
        window.__revisar();
      };
      img.onerror=function(){ alert("No se pudo leer la imagen."); };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(f);
  };

  // El video NO viaja como dataURL (pesa demasiado): se pide al servidor una URL firmada
  // de un solo uso y el teléfono sube el archivo directo a Storage. La ruta la decide el
  // servidor — aquí solo se guarda la que devuelve.
  window.__videoFile=function(input){
    var f=input.files&&input.files[0]; if(!f)return;
    if(f.size>80*1024*1024){ alert("El video es muy largo (máximo 80 MB). Graba uno más corto."); input.value=""; return; }
    if(vid.subiendo)return;
    vid.subiendo=true; vid.path=""; vid.nombre=f.name||"video";
    var prev=document.getElementById("pVideo");
    if(prev) prev.innerHTML='<div class="subiendo"><div class="spin"></div>Subiendo tu video…</div>';
    window.__revisar();
    var ext=(f.name&&f.name.indexOf(".")>=0)?f.name.split(".").pop():"";
    if(!ext) ext=(f.type&&f.type.indexOf("quicktime")>=0)?"mov":"mp4";

    fetch(FUNC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,accion:"firmar-video",ext:ext})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
      .then(function(res){
        if(!res.ok||!res.d.signedUrl) throw new Error(res.d&&res.d.error||"No se pudo preparar la subida");
        return fetch(res.d.signedUrl,{method:"PUT",headers:{"Content-Type":f.type||"video/mp4"},body:f})
          .then(function(up){ if(!up.ok) throw new Error("No se pudo subir el video"); return res.d.path; });
      })
      .then(function(path){
        vid.path=path; vid.subiendo=false;
        var btn=document.getElementById("bVideo");
        if(btn){ btn.classList.add("ok"); btn.innerHTML='<i class="ti ti-circle-check"></i><div><b>Video listo</b><span>Toca para grabar otro</span></div>'; btn.onclick=function(){document.getElementById("fVideo").click();}; }
        if(prev){ try{ prev.innerHTML='<div class="vidprev"><video controls playsinline src="'+URL.createObjectURL(f)+'"></video></div>'; }catch(e){ prev.innerHTML=""; } }
        window.__revisar();
      })
      .catch(function(e){
        vid.subiendo=false; vid.path="";
        if(prev) prev.innerHTML='<div style="font-size:12px;color:#dc2626;padding:8px 0">No se pudo subir el video. Toca arriba para intentarlo de nuevo.</div>';
        window.__revisar();
      });
    try{ input.value=""; }catch(e){}
  };

  window.__revisar=function(){
    var btn=document.getElementById("btnPublicar"); if(!btn)return;
    var chk=document.getElementById("chkAcepto");
    var listo=!!doc.frente && !!doc.dorso && !!doc.selfie && !!vid.path && !vid.subiendo && sigTiene && chk && chk.checked;
    btn.disabled=!listo;
  };

  window.__publicar=function(){
    if(enviando)return; enviando=true;
    var btn=document.getElementById("btnPublicar");
    if(btn){ btn.disabled=true; btn.innerHTML='<i class="ti ti-loader-2"></i> Enviando…'; }
    var firma=sigCanvas.toDataURL("image/png");
    fetch(FUNC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      id:id, cedula_frente:doc.frente, cedula_dorso:doc.dorso, firma:firma,
      selfie:doc.selfie, video_path:vid.path, video_guion:guionTexto()
    })}).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});}).then(function(res){
      enviando=false;
      if(!res.ok || res.d.error){
        if(btn){ btn.disabled=false; btn.innerHTML='<i class="ti ti-send"></i> Publicar'; }
        alert(res.d && res.d.error ? res.d.error : "No se pudo enviar. Intenta de nuevo.");
        return;
      }
      app.innerHTML='<div class="nav"><div class="lg"><i class="ti ti-signature"></i></div><div class="ttl"><b>Firma de préstamo</b><span>NEXUS PRO Financiamiento</span></div></div>'
        +'<div class="body"><div class="okwrap"><div class="ic"><i class="ti ti-circle-check"></i></div><h2>¡Listo, '+esc(primerNombre(S.nombre))+'!</h2>'
        +'<p>Tu cédula y tu firma se enviaron correctamente.<br>El negocio va a revisar tu información y te avisará cuando tu préstamo quede aprobado.</p></div></div>';
    }).catch(function(){
      enviando=false;
      if(btn){ btn.disabled=false; btn.innerHTML='<i class="ti ti-send"></i> Publicar'; }
      alert("No se pudo enviar. Verifica tu conexión e intenta de nuevo.");
    });
  };
})();
</script>
</body>
</html>
